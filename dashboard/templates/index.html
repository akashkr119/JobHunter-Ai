<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobHunter AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033}.shell{max-width:1180px;margin:auto;padding:32px 20px}.hero{background:#172033;color:#fff;border-radius:22px;padding:30px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#cbd5e1}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:18px 0}.stat,.card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:15px}.stat b{display:block;font-size:24px}.stat span,.score-caption{font-size:11px;color:#667085;text-transform:uppercase}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.filters input,.filters select,.status-select,.follow-days{padding:11px;border:1px solid #d7dce5;border-radius:10px;background:#fff}.count{margin-left:auto;font-weight:700;align-self:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}.card{border-radius:18px;padding:20px}.card.expired{opacity:.78}.top{display:flex;justify-content:space-between;gap:14px}.title{font-size:19px;margin:0}.company{margin:6px 0;color:#526077}.score-stack{text-align:center}.score{min-width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#e8f7ef;color:#087443;font-weight:900}.meta{font-size:13px;color:#6b7280;margin:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;margin:2px 4px 2px 0}.active-badge,.top-pick{background:#e8f7ef;color:#087443}.expired-badge,.consider,.priority-low{background:#f1f3f6;color:#667085}.strong-match,.priority-high{background:#e8efff;color:#2546a8}.good-match,.priority-medium{background:#fff4d6;color:#805b00}.apply-now{background:#dff8e9;color:#05603a}.follow-overdue{background:#ffe5e5;color:#a12626}.follow-due_soon{background:#fff4d6;color:#805b00}.follow-scheduled{background:#e8efff;color:#2546a8}.rank-line{margin-top:9px;font-size:13px;color:#526077}.rank-line strong{color:#172033}.label{font-size:12px;font-weight:800;text-transform:uppercase;margin:14px 0 7px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{padding:5px 8px;border-radius:8px;font-size:12px;background:#eef2ff}.missing{background:#fff0f0;color:#a12626}.tracker,.follow-row{display:flex;align-items:center;gap:8px;margin-top:16px}.status-select{flex:1}.follow-days{width:85px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:750;cursor:pointer}.apply{background:#172033;color:#fff}.details{background:#edf0f5;color:#172033}.save{background:#fff5cf;color:#725400}.saved{background:#ffd95a}.notes{width:100%;min-height:90px;margin-top:10px;padding:11px;border:1px solid #d7dce5;border-radius:10px;font:inherit}.note-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#667085}.description{white-space:pre-wrap;line-height:1.55;margin-top:12px}.empty,.error{background:#fff;border-radius:18px;padding:35px}.error{color:#a12626}@media(max-width:600px){.shell{padding:18px 12px}.count{margin-left:0;width:100%}}</style></head><body><main class="shell"><section class="hero"><h1>JobHunter AI</h1><p>Your ranked job command center — resume fit, preferences, freshness and application progress combined.</p></section><section class="stats" id="stats"><div class="stat"><b>–</b><span>Loading analytics</span></div></section><section class="filters"><input id="search" placeholder="Search title, company, location"><select id="score"><option value="0">All recommendations</option><option value="50">50+ recommendation</option><option value="65">Strong Match+</option><option value="80">Top Picks</option></select><select id="recommendation"><option value="">All recommendation labels</option><option value="top_pick">Top Pick</option><option value="strong_match">Strong Match</option><option value="good_match">Good Match</option><option value="consider">Consider</option></select><select id="priority"><option value="">All priorities</option><option value="apply_now">Apply Now</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select><select id="platform"><option value="">All platforms</option></select><select id="status"><option value="">All statuses</option><option value="new">New</option><option value="viewed">Viewed</option><option value="applied">Applied</option><option value="interview">Interview</option><option value="rejected">Rejected</option><option value="offer">Offer</option></select><select id="followUp"><option value="">All follow-ups</option><option value="overdue">Follow-up overdue</option><option value="due_soon">Follow-up due soon</option><option value="scheduled">Follow-up scheduled</option></select><select id="lifecycle"><option value="">All lifecycle</option><option value="active">Active jobs</option><option value="expired">Expired jobs</option></select><select id="savedFilter"><option value="">All jobs</option><option value="saved">★ Saved jobs</option></select><div class="count" id="count">Loading…</div></section><section id="jobs" class="grid"></section></main><script>const E=id=>document.getElementById(id),jobsEl=E('jobs'),searchEl=E('search'),scoreEl=E('score'),recEl=E('recommendation'),priorityEl=E('priority'),platformEl=E('platform'),statusEl=E('status'),followEl=E('followUp'),lifecycleEl=E('lifecycle'),savedEl=E('savedFilter'),countEl=E('count');let jobs=[];const statuses=['new','viewed','applied','interview','rejected','offer'],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tags=(a,c='')=>(a||[]).slice(0,8).map(x=>`<span class="tag ${c}">${esc(x)}</span>`).join('')||'<span class="tag">None</span>',statusOptions=current=>statuses.map(s=>`<option value="${s}" ${s===current?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join(''),name=x=>String(x||'consider').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()),followName=s=>({overdue:'Follow-up overdue',due_soon:'Follow-up due soon',scheduled:'Follow-up scheduled'}[s]||'');async function loadAnalytics(){try{const r=await fetch('/api/analytics'),a=await r.json();E('stats').innerHTML=[['Total jobs',a.total],['Active',a.active],['New today',a.new_today],['Saved',a.saved],['Applied',a.applied],['Follow-ups due',a.follow_up_due||0],['Interviews',a.interview],['Offers',a.offer],['Avg active match',`${a.average_match_score}%`],['Response rate',`${a.response_rate}%`]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}catch(e){E('stats').innerHTML='<div class="error">Analytics unavailable</div>'}}function render(){const q=searchEl.value.trim().toLowerCase(),p=platformEl.value,s=statusEl.value,fu=followEl.value,l=lifecycleEl.value,pr=priorityEl.value,rl=recEl.value,min=Number(scoreEl.value),onlySaved=savedEl.value==='saved',f=jobs.filter(j=>(j.recommendation_score||0)>=min&&(!rl||j.recommendation_label===rl)&&(!pr||j.priority_label===pr)&&(!p||j.platform===p)&&(!s||j.application_status===s)&&(!fu||j.follow_up_status===fu)&&(!l||(l==='active'?j.is_active:!j.is_active))&&(!onlySaved||j.is_saved)&&(!q||`${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q)));countEl.textContent=`${f.length} job${f.length===1?'':'s'}`;jobsEl.innerHTML=f.length?f.map(j=>`<article class="card ${j.is_active?'':'expired'}"><div class="top"><div><h2 class="title">${esc(j.title)}</h2><div class="company">${esc(j.company)}</div><span class="badge ${j.is_active?'active-badge':'expired-badge'}">${j.is_active?'Active':'Expired'}</span><span class="badge ${j.recommendation_label?.replaceAll('_','-')||'consider'}">${name(j.recommendation_label)}</span><span class="badge ${j.priority_label==='apply_now'?'apply-now':`priority-${j.priority_label||'low'}`}">${name(j.priority_label)}</span>${j.follow_up_status!=='none'?`<span class="badge follow-${j.follow_up_status}">${followName(j.follow_up_status)}</span>`:''}<div class="rank-line"><strong>${Number(j.match_score||0).toFixed(0)}%</strong> resume · <strong>${Number(j.preference_score||0).toFixed(0)}%</strong> preference</div></div><div class="score-stack"><div class="score">${Math.round(j.recommendation_score||0)}</div><div class="score-caption">Recommendation</div></div></div><div class="meta">${esc(j.location||'Location not listed')} · ${esc(j.platform||'unknown')}${j.last_seen_at?` · Last seen ${esc(j.last_seen_at)}`:''}</div><div class="label">Matched skills</div><div class="tags">${tags(j.matched_skills)}</div><div class="label">Missing required</div><div class="tags">${tags(j.missing_required_skills,'missing')}</div><div class="tracker"><strong>Status</strong><select class="status-select" onchange="setStatus(${j.id},this)">${statusOptions(j.application_status||'new')}</select></div>${j.application_status==='applied'?`<div class="follow-row"><strong>Follow up</strong><input class="follow-days" id="follow-days-${j.id}" type="number" min="1" max="90" value="${j.follow_up_days}"><span>days</span><button class="btn details" onclick="saveFollowUp(${j.id})">Set</button>${j.follow_up_status!=='none'?`<button class="btn details" onclick="completeFollowUp(${j.id})">Done</button>`:''}</div>`:''}<div class="actions"><button class="btn save ${j.is_saved?'saved':''}" onclick="toggleSave(${j.id})">${j.is_saved?'★ Saved':'☆ Save'}</button><a class="btn apply" href="${esc(j.apply_url)}" target="_blank" rel="noopener noreferrer" onclick="markViewed(${j.id})">Apply</a><button class="btn details" onclick="details(${j.id},this)">Details</button></div><div class="label">Notes</div><textarea class="notes" id="notes-${j.id}" maxlength="5000">${esc(j.notes||'')}</textarea><div class="note-row"><span id="note-state-${j.id}"></span><button class="btn details" onclick="saveNotes(${j.id})">Save notes</button></div><div class="description" id="detail-${j.id}"></div></article>`).join(''):'<div class="empty">No jobs match your filters.</div>'}async function patchTracking(id,payload){const r=await fetch(`/api/jobs/${id}/tracking`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to update job');Object.assign(jobs.find(x=>x.id===id)||{},j);return j}async function patchFollow(id,payload){const r=await fetch(`/api/jobs/${id}/follow-up`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to update follow-up');Object.assign(jobs.find(x=>x.id===id)||{},j);sortRender();loadAnalytics()}const sortRender=()=>{jobs.sort((a,b)=>(b.recommendation_score||0)-(a.recommendation_score||0));render()};async function saveFollowUp(id){try{await patchFollow(id,{follow_up_days:Number(E(`follow-days-${id}`).value)})}catch(e){alert(e.message)}}async function completeFollowUp(id){try{await patchFollow(id,{completed:true})}catch(e){alert(e.message)}}async function toggleSave(id){const x=jobs.find(x=>x.id===id);if(!x)return;try{await patchTracking(id,{saved:!x.is_saved});sortRender();loadAnalytics()}catch(e){alert(e.message)}}async function saveNotes(id){const area=E(`notes-${id}`),state=E(`note-state-${id}`);state.textContent='Saving…';try{await patchTracking(id,{notes:area.value});state.textContent='Saved'}catch(e){state.textContent=e.message}}async function setStatus(id,select){select.disabled=true;try{const r=await fetch(`/api/jobs/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:select.value})}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to update status');Object.assign(jobs.find(x=>x.id===id)||{},j);sortRender();loadAnalytics()}catch(e){alert(e.message);await load()}finally{select.disabled=false}}async function markViewed(id){const j=jobs.find(x=>x.id===id);if(j&&j.application_status==='new'){fetch(`/api/jobs/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'viewed'})}).then(async r=>{if(r.ok){Object.assign(j,await r.json());sortRender();loadAnalytics()}})}}async function details(id,b){const e=E(`detail-${id}`);if(e.dataset.loaded){e.hidden=!e.hidden;b.textContent=e.hidden?'Details':'Hide';return}b.disabled=true;try{const r=await fetch(`/api/jobs/${id}`),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load job');e.textContent=j.description||'No description available.';e.dataset.loaded='1';b.textContent='Hide'}catch(x){e.textContent=x.message}finally{b.disabled=false}}async function load(){try{const r=await fetch('/api/jobs?limit=500'),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load jobs');jobs=d.jobs||[];platformEl.innerHTML='<option value="">All platforms</option>';[...new Set(jobs.map(j=>j.platform).filter(Boolean))].sort().forEach(p=>platformEl.insertAdjacentHTML('beforeend',`<option value="${esc(p)}">${esc(p)}</option>`));sortRender()}catch(e){countEl.textContent='Error';jobsEl.innerHTML=`<div class="error">${esc(e.message)}</div>`}}[searchEl,scoreEl,recEl,priorityEl,platformEl,statusEl,followEl,lifecycleEl,savedEl].forEach(e=>e.addEventListener(e===searchEl?'input':'change',render));load();loadAnalytics();</script></body></html>
