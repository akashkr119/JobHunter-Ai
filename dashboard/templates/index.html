<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobHunter-AI Dashboard</title>
</head>
<body>
  <h1>JobHunter-AI Dashboard</h1>
  <section>
    <input type="text" placeholder="Search jobs...">
    <button>Search</button>
  </section>
  <section>
    <h2>Statistics</h2>
    <p>Total Jobs: --</p>
    <p>Total Matches: --</p>
    <p>Crawler Status: Idle</p>
  </section>
  <section>
    <h2>Jobs</h2>
    <table border="1">
      <tr><th>Company</th><th>Role</th><th>Location</th><th>Score</th></tr>
    </table>
  </section>
</body>
</html>
